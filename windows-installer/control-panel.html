<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Gráfica - Painel de Controle</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        h1 { color: #333; margin-bottom: 8px; font-size: 28px; }
        .subtitle { color: #666; margin-bottom: 30px; font-size: 14px; }
        .status-card { background: #f8f9fa; border-radius: 12px; padding: 20px; margin-bottom: 20px; border-left: 4px solid #28a745; }
        .status-card.warning { border-left-color: #ffc107; }
        .status-card.error { border-left-color: #dc3545; }
        .status-title { font-weight: 600; color: #333; margin-bottom: 8px; }
        .status-value { font-size: 24px; color: #28a745; font-weight: 700; }
        .status-value.warning { color: #ffc107; }
        .status-value.error { color: #dc3545; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
        .info-item { background: #f8f9fa; padding: 15px; border-radius: 8px; }
        .info-label { font-size: 12px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
        .info-value { font-size: 16px; color: #333; font-weight: 600; word-break: break-all; }
        .button-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn { padding: 15px 20px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn:hover { transform: translateY(-2px); }
        .btn-primary { background: #667eea; color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-warning { background: #ffc107; color: #333; }
        .btn-info { background: #17a2b8; color: white; }
        .footer { margin-top: 30px; text-align: center; font-size: 12px; color: #999; }
        .footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏢 CRM Gráfica</h1>
        <p class="subtitle">Painel de Controle do Servidor</p>
        
        <div class="status-card" id="appStatus">
            <div class="status-title">Status da Aplicação</div>
            <div class="status-value" id="appStatusValue">Verificando...</div>
        </div>
        
        <div class="status-card" id="dbStatus">
            <div class="status-title">Status do Banco de Dados</div>
            <div class="status-value" id="dbStatusValue">Verificando...</div>
        </div>
        
        <div class="info-grid">
            <div class="info-item">
                <div class="info-label">IP da Rede Local</div>
                <div class="info-value" id="localIp">-</div>
            </div>
            <div class="info-item">
                <div class="info-label">URL de Acesso</div>
                <div class="info-value" id="accessUrl">-</div>
            </div>
            <div class="info-item">
                <div class="info-label">Versão</div>
                <div class="info-value">2.0.0</div>
            </div>
            <div class="info-item">
                <div class="info-label">Último Backup</div>
                <div class="info-value" id="lastBackup">-</div>
            </div>
        </div>
        
        <div class="button-group">
            <button class="btn btn-primary" onclick="openApp()">🌐 Abrir Aplicação</button>
            <button class="btn btn-success" onclick="runBackup()">💾 Fazer Backup</button>
            <button class="btn btn-warning" onclick="viewLogs()">📋 Ver Logs</button>
            <button class="btn btn-info" onclick="restartServices()">🔄 Reiniciar Serviços</button>
        </div>
        
        <div class="footer">
            <p>CRM Gráfica © 2026 | <a href="/api/v1/health">Health Check</a></p>
        </div>
    </div>
    
    <script>
        async function checkStatus() {
            try {
                const response = await fetch('/api/v1/health');
                const data = await response.json();
                const appStatusEl = document.getElementById('appStatusValue');
                if (data.status === 'ok') {
                    appStatusEl.textContent = '✅ Online';
                    appStatusEl.className = 'status-value';
                } else {
                    appStatusEl.textContent = '⚠️ Degradado';
                    appStatusEl.className = 'status-value warning';
                }
            } catch (e) {
                document.getElementById('appStatusValue').textContent = '❌ Offline';
                document.getElementById('appStatusValue').className = 'status-value error';
            }
            document.getElementById('dbStatusValue').textContent = '✅ Conectado';
        }
        
        function updateInfo() {
            const ip = window.location.hostname;
            document.getElementById('localIp').textContent = ip;
            document.getElementById('accessUrl').textContent = 'http://' + ip + ':3000';
        }
        
        function openApp() { window.open('http://' + window.location.hostname + ':3000', '_blank'); }
        async function runBackup() { fetch('/api/v1/admin/backup/run', { method: 'POST' }).then(r => r.ok ? alert('Backup iniciado!') : alert('Erro.')); }
        function viewLogs() { window.open('/logs', '_blank'); }
        async function restartServices() { if (confirm('Reiniciar serviços?')) fetch('/api/v1/admin/restart', { method: 'POST' }).then(r => r.ok ? alert('Reinicialização iniciada.') : alert('Erro.')); }
        
        checkStatus();
        updateInfo();
        setInterval(checkStatus, 30000);
    </script>
</body>
</html>
