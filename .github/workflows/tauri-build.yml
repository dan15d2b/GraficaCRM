name: Tauri Builds

on:
  push:
    branches: [master, "releases/**"]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: "Versão do build (padrão: 0.1.0)"
        required: false
        default: "0.1.0"
      upload_artifacts:
        description: "Fazer upload dos artefatos"
        type: boolean
        default: true

# Cancela runs anteriores da mesma branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permissões mínimas
permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────
  # Linux — gera .deb
  # ──────────────────────────────────────────────────────────────
  linux-deb:
    name: Build .deb (Linux amd64)
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            patchelf \
            fakeroot \
            dpkg

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
          components: rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Instalar dependências Node
        run: pnpm install --frozen-lockfile

      - name: Build do binário Rust
        run: bash src-tauri/build.sh
        env:
          RUSTFLAGS: "-C opt-level=0 -C codegen-units=8 -C embed-bitcode=no -C lto=off"
          CARGO_BUILD_JOBS: 1
          LD: /usr/bin/ld.gold

      - name: Construir .deb
        run: bash src-tauri/build-deb.sh

      - name: Upload artefato .deb
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: crmgrafica-linux-amd64
          path: src-tauri/target/release/crmgrafica_0.1.0_amd64.deb
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # Windows — gera .exe (installer NSIS)
  # ──────────────────────────────────────────────────────────────
  windows-exe:
    name: Build .exe (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: rustfmt

      - name: Instalar MinGW (para link cross)
        run: |
          choco install mingw -y
          # Adicionar MinGW ao PATH
          $env:PATH += ";C:\Program Files\mingw-w64\x86_64-*-mingw\bin"
          echo $env:PATH | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Instalar dependências Node
        run: pnpm install --frozen-lockfile

      - name: Build do binário Rust (Windows)
        run: |
          $env:CARGO_BUILD_JOBS = "1"
          $env:RUSTFLAGS = "-C opt-level=0 -C codegen-units=8 -C embed-bitcode=no -C lto=off"
          bash src-tauri/build.sh
        shell: bash

      - name: Build Tauri bundle (NSIS)
        run: |
          npx tauri build
        shell: bash

      - name: Upload artefato .exe
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: crmgrafica-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # Verifica se pelo menos um build passou (se fall, marca o workflow como fail)
  # ──────────────────────────────────────────────────────────────
  summary:
    name: Build Summary
    needs: [linux-deb, windows-exe]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verificar resultado dos builds
        run: |
          if [[ "${{ needs.linux-deb.result }}" == "success" ]] || [[ "${{ needs.windows-exe.result }}" == "success" ]]; then
            echo "✅ Pelo menos um build passou."
          else
            echo "❌ Todos os builds falharam."
            exit 1
          fi
