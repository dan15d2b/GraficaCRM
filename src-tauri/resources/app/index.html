<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Gráfica</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ════════════ LOGIN PAGE ════════════ -->
<div id="login-page">
  <div class="login-card">
    <h1>CRM Gráfica</h1>
    <p class="subtitle">Faça login para continuar</p>
    <form id="login-form">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seu@email.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary" id="login-btn">Entrar</button>
      <div class="login-error" id="login-error"></div>
    </form>
  </div>
</div>

<!-- ════════════ APP SHELL ════════════ -->
<div id="crm-app">
  <div class="app-shell">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">📊 CRM Gráfica</div>
      <nav class="sidebar-nav">
        <a class="nav-item active" data-page="dashboard">
          <span class="icon">🏠</span><span>Painel</span>
        </a>
        <a class="nav-item" data-page="contacts">
          <span class="icon">👥</span><span>Contatos</span>
        </a>
        <a class="nav-item" data-page="proposals">
          <span class="icon">📋</span><span>Propostas</span>
        </a>
        <a class="nav-item" data-page="inbox">
          <span class="icon">✉️</span><span>Central</span>
        </a>
        <a class="nav-item" data-page="settings">
          <span class="icon">⚙️</span><span>Configurações</span>
        </a>
      </nav>
      <div class="sidebar-footer">CRM Gráfica v1.0</div>
    </aside>

    <!-- Main -->
    <div class="main-area">
      <div class="topbar">
        <div class="topbar-title" id="page-title">Painel</div>
        <div class="topbar-user">
          <span id="user-email"></span>
          <button class="btn-logout" id="btn-logout">Sair</button>
        </div>
      </div>
      <div class="content" id="page-content">
        <!-- Pages render here -->
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js"></script>
</body>
</html>
